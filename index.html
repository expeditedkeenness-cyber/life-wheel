<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Колесо Баланса</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAdypqxdS_w2bp_ubPg4_9YoNXq7HLIBIE",
      authDomain: "life-wheel-5e119.firebaseapp.com",
      projectId: "life-wheel-5e119",
      storageBucket: "life-wheel-5e119.firebasestorage.app",
      messagingSenderId: "1044261685647",
      appId: "1:1044261685647:web:350a3d2f821c4052e0e3fa",
      measurementId: "G-RM1ZL6WJ4Q"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.loginWithGoogle = function() {
      signInWithPopup(auth, provider).catch((error) => console.error(error));
    };

    window.logoutFromGoogle = function() {
      signOut(auth);
    };

    onAuthStateChanged(auth, async (user) => {
      const authBtn = document.getElementById('authBtnText');
      const userAvatar = document.getElementById('userAvatar');
      
      if (user) {
        authBtn.innerText = user.displayName.split(' ')[0];
        document.getElementById('authBox').onclick = window.logoutFromGoogle;
        if(user.photoURL) {
          userAvatar.src = user.photoURL;
          userAvatar.style.display = 'block';
        }
        await loadUserData(user.uid);
      } else {
        authBtn.innerText = 'Войти';
        document.getElementById('authBox').onclick = window.loginWithGoogle;
        userAvatar.style.display = 'none';
      }
    });

    window.saveUserData = async function(newScores, newTaskList) {
      const user = auth.currentUser;
      if (!user) {
        localStorage.setItem('streletskayaThemeScores', JSON.stringify(newScores));
        localStorage.setItem('streletskayaThemeTasksV3', JSON.stringify(newTaskList));
        return;
      }
      try {
        await setDoc(doc(db, "users", user.uid), {
          scores: newScores,
          tasksV3: newTaskList,
          updatedAt: new Date()
        });
      } catch (e) {
        console.error("Ошибка сохранения в облако: ", e);
      }
    };

    async function loadUserData(uid) {
      try {
        const docRef = doc(db, "users", uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.scores) {
            scores = data.scores;
            updateSlidersAndChart();
          }
          if (data.tasksV3) {
            taskList = data.tasksV3;
            renderTasksTab();
          } else if (data.tasksV2) {
            taskList = data.tasksV2;
            renderTasksTab();
          }
        }
      } catch (e) {
        console.error("Ошибка загрузки из облака: ", e);
      }
    }
  </script>

  <style>
    :root {
      --bg-color: #121212;
      --text-color: #ffffff;
      --card-bg: #1e1e1e;
      --card-sub-bg: #282828;
      --accent-color: #3797f0;
      --accent-text: #ffffff;
      --border-color: rgba(255, 255, 255, 0.12);
      --subtext-color: #b0b0b0;
      --success-color: #4caf50;
    }

    body.light-theme {
      --bg-color: #f4f5f7;
      --text-color: #121212;
      --card-bg: #ffffff;
      --card-sub-bg: #eaeaea;
      --accent-color: #2481cc;
      --accent-text: #ffffff;
      --border-color: rgba(0, 0, 0, 0.08);
      --subtext-color: #666666;
      --success-color: #2e7d32;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);

      transition: background-color 0.5s ease, color 0.5s ease;
      -webkit-tap-highlight-color: transparent;
    }

    body.is-blur {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      opacity: 0.4;
      pointer-events: none;
      transform: scale(0.99);
      transition: backdrop-filter 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
    }

    body {
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      opacity: 1;
      transform: scale(1);
      transition: backdrop-filter 0.4s ease, opacity 0.4s ease, transform 0.4s ease, background-color 0.5s ease, color 0.5s ease;
    }
    
    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; padding: 6px 4px;
    }
    .app-brand {
      display: flex; align-items: center; gap: 8px;
    }
    .app-logo {
      width: 30px; height: 30px; background: var(--accent-color);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-size: 16px; box-shadow: 0 4px 12px rgba(55, 151, 240, 0.3);
    }
    .app-title-text {
      font-weight: 700; font-size: 15px; letter-spacing: -0.3px; line-height: 1.1;
    }
    .app-subtitle-text {
      font-weight: 500; font-size: 11px; color: var(--subtext-color);
    }

    .header-controls { display: flex; gap: 6px; align-items: center; }
    
    .auth-box {
      display: flex; align-items: center; gap: 6px;
      background: var(--card-bg); border: 1px solid var(--border-color);
      padding: 4px 10px 4px 6px; border-radius: 20px; cursor: pointer;
      transition: all 0.2s ease;
    }
    .auth-box:active { transform: scale(0.96); }
    .user-avatar { width: 22px; height: 22px; border-radius: 50%; display: none; object-fit: cover; }
    .auth-text { font-size: 11px; font-weight: 600; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .btn-icon {
      background: var(--card-bg); color: var(--text-color);
      border: 1px solid var(--border-color); width: 32px; height: 32px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 13px; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0;
    }
    .btn-icon:active { transform: scale(0.92); }

    .nav-tabs { display: flex; gap: 6px; background: var(--card-bg); padding: 4px; border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    .tab-btn { flex: 1; padding: 9px 4px; border: none; background: transparent; font-size: 12px; font-weight: 600; color: var(--subtext-color); cursor: pointer; border-radius: 8px; text-align: center; transition: all 0.2s ease; }
    .tab-btn.active { background: var(--accent-color); color: var(--accent-text); box-shadow: 0 2px 8px rgba(55, 151, 240, 0.3); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .chart-container { position: relative; width: 100%; max-width: 380px; margin: 0 auto; }
    .slider-group { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .slider-group label { font-size: 13px; flex: 1; font-weight: 500; }
    .slider-group input { width: 40%; accent-color: var(--accent-color); }
    .slider-group span { width: 25px; text-align: right; font-weight: bold; color: var(--accent-color); }

    .info-card { background: var(--card-bg); border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border-color); border-left: 4px solid var(--accent-color); transition: background 0.3s, border-color 0.3s; }
    .info-card h4 { margin: 0 0 6px 0; color: var(--accent-color); font-size: 14px; }
    .info-card p { margin: 0; font-size: 12px; line-height: 1.4; color: var(--text-color); }

    .task-add-box {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
      transition: background 0.3s, border-color 0.3s;
    }
    
    .input-row { display: flex; gap: 8px; margin-bottom: 8px; }

    select, input[type="text"], input[type="date"] {
      padding: 9px 12px; box-sizing: border-box;
      border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--card-sub-bg); color: var(--text-color); font-size: 13px; outline: none;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }
    
    input[type="date"] { width: 130px; text-align: center; font-size: 12px; }

    .primary-btn {
      width: 100%; padding: 10px;
      background-color: var(--accent-color); color: var(--accent-text);
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px;
    }
    
    .sub-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .sub-tab-btn {
      flex: 1; padding: 8px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border-color); background: var(--card-bg);
      color: var(--subtext-color); border-radius: 8px; cursor: pointer; text-align: center;
      transition: background 0.3s, color 0.3s;
    }
    .sub-tab-btn.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }

    .task-list { list-style: none; padding: 0; margin: 0; }
    
    .task-item {
      display: flex; align-items: center; gap: 8px;
      background: var(--card-bg); padding: 10px 12px; margin-bottom: 8px;
      border-radius: 10px; font-size: 13px; border: 1px solid var(--border-color);
      transition: background 0.3s, border-color 0.3s;
    }
    
    .check-btn {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid var(--subtext-color);
      background: transparent; cursor: pointer; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
      padding: 0; color: transparent; font-size: 12px; transition: all 0.2s;
    }
    .task-item.completed .check-btn {
      background: var(--success-color); border-color: var(--success-color); color: #fff;
    }

    .task-item.completed .task-text { text-decoration: line-through; color: var(--subtext-color); }
    
    .task-cat-badge {
      font-size: 10px; padding: 3px 7px; border-radius: 6px;
      background: var(--card-sub-bg); color: var(--accent-color);
      font-weight: 600; flex-shrink: 0; border: 1px solid var(--border-color);
      white-space: nowrap; transition: background 0.3s, color 0.3s;
    }
    
    .task-text { flex: 1; min-width: 0; word-break: break-word; }
    .delete-btn { background: none; border: none; color: #ff5252; cursor: pointer; font-weight: bold; font-size: 16px; padding: 0 4px; flex-shrink: 0; }

    .calendar-card { background: var(--card-bg); border-radius: 12px; padding: 12px; border: 1px solid var(--border-color); margin-bottom: 12px; transition: background 0.3s; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; font-size: 13px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 11px; }
    .cal-day-head { font-weight: bold; color: var(--subtext-color); padding: 4px 0; }
    .cal-day { padding: 8px 0; border-radius: 6px; background: var(--card-sub-bg); cursor: pointer; position: relative; transition: background 0.3s; }
    .cal-day.active { background: var(--accent-color); color: #fff; font-weight: bold; }
    .cal-day.has-done::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--success-color); border-radius: 50%; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 16px; box-sizing: border-box;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 16px; width: 100%; max-width: 360px; padding: 20px;
      box-sizing: border-box; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-card h3 { color: var(--accent-color); margin-top: 0; font-size: 18px; }
    .modal-card p { font-size: 13px; line-height: 1.5; color: var(--text-color); margin-bottom: 20px; }
    .modal-steps { font-size: 11px; color: var(--subtext-color); margin-bottom: 12px; font-weight: bold; }
    .modal-buttons { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <!-- Путеводитель / Онбординг -->
  <div class="modal-overlay" id="onboardingModal">
    <div class="modal-card">
      <div class="modal-steps" id="onboardingStepIndicator">Шаг 1 из 3</div>
      <h3 id="onboardingTitle">Заголовок</h3>
      <p id="onboardingText">Текст объяснения...</p>
      <div class="modal-buttons">
        <button class="btn-icon" style="width:auto; flex:1; border-radius:8px; height:auto; padding: 10px;" id="onboardingSkipBtn" onclick="closeOnboarding()">Пропустить</button>
        <button class="primary-btn" style="flex:1; margin-bottom:0;" id="onboardingNextBtn" onclick="nextOnboardingStep()">Далее</button>
      </div>
    </div>
  </div>

  <div class="header-bar">
    <div class="app-brand">
      <div class="app-logo">🎯</div>
      <div>
        <div class="app-title-text" id="appTitleMain">Колесо</div>
        <div class="app-subtitle-text" id="appTitleSub">Баланса</div>
      </div>
    </div>

    <div class="header-controls">
      <div class="auth-box" id="authBox">
        <img id="userAvatar" class="user-avatar" alt="User">
        <span class="auth-text" id="authBtnText">Войти</span>
      </div>
      <button class="btn-icon" onclick="toggleTheme()" id="themeBtn" title="Сменить тему">🌙</button>
      <button class="btn-icon" onclick="toggleLanguage()" id="langBtn" title="Сменить язык" style="font-weight: bold; font-size: 11px;">UA</button>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="openTab(event, 'wheelTab')" id="tab1">📊 Колесо</button>
    <button class="tab-btn" onclick="openTab(event, 'infoTab')" id="tab2">📖 Описание</button>
    <button class="tab-btn" onclick="openTab(event, 'tasksTab')" id="tab3">✅ Задачи</button>
  </div>

  <!-- Колесо -->
  <div id="wheelTab" class="tab-content active">
    <div class="chart-container">
      <canvas id="wheelChart"></canvas>
    </div>
    <div class="sliders" id="slidersContainer" style="margin-top:15px;"></div>
  </div>

  <!-- Описание -->
  <div id="infoTab" class="tab-content">
    <div style="margin-bottom: 12px;">
      <button class="primary-btn" onclick="showOnboarding(true)" id="guideBtn">📖 Открыть путеводитель (КПТ)</button>
    </div>
    <div id="infoCardsContainer"></div>
  </div>

  <!-- Вкладка Задач -->
  <div id="tasksTab" class="tab-content">
    
    <div class="sub-tabs">
      <button class="sub-tab-btn active" onclick="switchTaskSubTab(event, 'activeTasks')" id="subTabActive">📋 Задачи</button>
      <button class="sub-tab-btn" onclick="switchTaskSubTab(event, 'calendarTasks')" id="subTabCalendar">📅 Календарь</button>
      <button class="sub-tab-btn" onclick="switchTaskSubTab(event, 'archiveTasks')" id="subTabArchive">📂 Архив</button>
    </div>

    <div class="task-add-box" id="taskAddBox">
      <div class="input-row">
        <select id="taskCategorySelect" style="flex: 1;" onchange="updateTemplates()"></select>
        <input type="date" id="taskDueDate">
      </div>

      <input type="text" id="taskInput" placeholder="Введите название задачи..." style="width: 100%; margin-bottom: 8px;">
      
      <select id="templateSelect" onchange="applyTemplate()" style="width: 100%; margin-bottom: 8px;">
        <option value="" id="templatePlaceholder">💡 Или выберите из готовых идей...</option>
      </select>

      <button class="primary-btn" onclick="addTask()" id="addBtn">Добавить задачу</button>
    </div>

    <!-- Вкладка: Активные задачи -->
    <div id="activeTasksSection">
      <ul class="task-list" id="activeTaskList"></ul>
    </div>

    <!-- Вкладка: Календарь -->
    <div id="calendarTasksSection" style="display: none;">
      <div class="calendar-card">
        <div class="calendar-header">
          <button class="btn-icon" style="width:28px; height:28px;" onclick="changeMonth(-1)">&lt;</button>
          <span id="calMonthYear">Октябрь 2026</span>
          <button class="btn-icon" style="width:28px; height:28px;" onclick="changeMonth(1)">&gt;</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
      
      <div style="font-size: 12px; font-weight: bold; margin-bottom: 8px; color: var(--accent-color);" id="calSelectedDateTitle">Задачи на выбранную дату:</div>
      <ul class="task-list" id="calendarTaskList"></ul>
    </div>

    <!-- Вкладка: Архив -->
    <div id="archiveTasksSection" style="display: none;">
      <div style="margin-bottom: 10px;">
        <select id="archiveFilterSelect" onchange="changeArchiveFilter(this.value)" style="width: 100%;">
          <option value="all" id="archOptAll">📂 Все время</option>
          <option value="today" id="archOptToday">📅 За сегодня</option>
          <option value="week" id="archOptWeek">🗓 За 7 дней</option>
          <option value="month" id="archOptMonth">📊 За месяц</option>
          <option value="year" id="archOptYear">⏳ Год назад</option>
        </select>
      </div>

      <ul class="task-list" id="archiveTaskList"></ul>
    </div>

  </div>

    let currentTheme = localStorage.getItem('appTheme') || 'dark';

        addBtn: 'Добавить задачу',
        archOptAll: '📂 Все время', archOptToday: '📅 За сегодня', archOptWeek: '🗓 За 7 дней', archOptMonth: '📊 За месяц', archOptYear: '⏳ Год назад',

        emptyCalendar: 'Нет задач на эту дату',

        guideBtn: '📖 Открыть путеводитель (КПТ)',
        langBtn: 'UA',
        categories: ['Работа', 'Семья', 'Друзья', 'Хобби', 'Отдых', 'Здоровье', 'Духовность', 'Саморазвитие'],
        onboarding: [
          {
            title: '🧠 Зачем нужно Колесо Баланса?',
            text: 'С точки зрения КПТ (когнитивно-поведенческой терапии), наш мозг часто зацикливается на одной сфере (например, на работе), упуская другие. Это приводит к когнитивным искажениям и выгоранию. Оценка сфер помогает вернуть объективный взгляд на жизнь.'

          {

          {

        ],
        descriptions: [
          { name: '1
