  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAdypqxdS_w2bp_ubPg4_9YoNXq7HLIBIE",
      authDomain: "life-wheel-5e119.firebaseapp.com",
      projectId: "life-wheel-5e119",
      storageBucket: "life-wheel-5e119.firebasestorage.app",
      messagingSenderId: "1044261685647",
      appId: "1:1044261685647:web:350a3d2f821c4052e0e3fa",
      measurementId: "G-RM1ZL6WJ4Q"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.loginWithGoogle = function() {
      signInWithPopup(auth, provider).catch((error) => console.error(error));
    };

    window.logoutFromGoogle = function() {
      signOut(auth);
    };

    onAuthStateChanged(auth, async (user) => {
      const authBtn = document.getElementById('authBtn');
      const userAvatar = document.getElementById('userAvatar');
      
      if (user) {
        authBtn.innerText = `Выйти (${user.displayName.split(' ')[0]})`;
        authBtn.onclick = window.logoutFromGoogle;
        if(user.photoURL) {
          userAvatar.src = user.photoURL;
          userAvatar.style.display = 'block';
        }
        await loadUserData(user.uid);
      } else {
        authBtn.innerText = '🌐 Войти';
        authBtn.onclick = window.loginWithGoogle;
        userAvatar.style.display = 'none';
      }
    });

    window.saveUserData = async function(newScores, newTaskList) {
      const user = auth.currentUser;
      if (!user) {
        localStorage.setItem('streletskayaThemeScores', JSON.stringify(newScores));
        localStorage.setItem('streletskayaThemeTasksV3', JSON.stringify(newTaskList));
        return;
      }
      try {
        await setDoc(doc(db, "users", user.uid), {
          scores: newScores,
          tasksV3: newTaskList,
          updatedAt: new Date()
        });
      } catch (e) {
        console.error("Ошибка сохранения в облако: ", e);
      }
    };

    async function loadUserData(uid) {
      try {
        const docRef = doc(db, "users", uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.scores) {
            scores = data.scores;
            updateSlidersAndChart();
          }
          if (data.tasksV3) {
            taskList = data.tasksV3;
            renderTasksTab();
          } else if (data.tasksV2) {
            taskList = data.tasksV2;
            renderTasksTab();
          }
        }
      } catch (e) {
        console.error("Ошибка загрузки из облака: ", e);
      }
    }
  </script>

    body {

    .header-controls { display: flex; gap: 6px; align-items: center; }
    .btn-toggle {

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .chart-container { position: relative; width: 100%; max-width: 380px; margin: 0 auto; }
    .slider-group { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .slider-group label { font-size: 13px; flex: 1; font-weight: 500; }
    .slider-group input { width: 40%; accent-color: var(--accent-color); }
    .slider-group span { width: 25px; text-align: right; font-weight: bold; color: var(--accent-color); }

    .info-card { background: var(--card-bg); border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border-color); border-left: 4px solid var(--accent-color); transition: background 0.3s, border-color 0.3s; }

    .task-add-box {

      border: 1px solid var(--border-color);

    .input-row { display: flex; gap: 8px; margin-bottom: 8px; }

    select, input[type="text"], input[type="date"] {
      padding: 9px 12px; box-sizing: border-box;

      background: var(--card-sub-bg); color: var(--text-color); font-size: 13px; outline: none;

    input[type="date"] { width: 130px; text-align: center; font-size: 12px; }

    .primary-btn {
      width: 100%; padding: 10px;
      background-color: var(--accent-color); color: var(--accent-text);
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px;
    }
    
    .sub-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .sub-tab-btn {
      flex: 1; padding: 8px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border-color); background: var(--card-bg);
      color: var(--subtext-color); border-radius: 8px; cursor: pointer; text-align: center;
      transition: background 0.3s, color 0.3s;
    }
    .sub-tab-btn.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }

    .task-list { list-style: none; padding: 0; margin: 0; }
    
    .task-item {
      display: flex; align-items: center; gap: 8px;
      background: var(--card-bg); padding: 10px 12px; margin-bottom: 8px;
      border-radius: 10px; font-size: 13px; border: 1px solid var(--border-color);
      transition: background 0.3s, border-color 0.3s;
    }
    
    .check-btn {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid var(--subtext-color);
      background: transparent; cursor: pointer; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
      padding: 0; color: transparent; font-size: 12px; transition: all 0.2s;
    }
    .task-item.completed .check-btn {
      background: var(--success-color); border-color: var(--success-color); color: #fff;
    }

    .task-item.completed .task-text { text-decoration: line-through; color: var(--subtext-color); }
    
    .task-cat-badge {

    .delete-btn { background: none; border: none; color: #ff5252; cursor: pointer; font-weight: bold; font-size: 16px; padding: 0 4px; flex-shrink: 0; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 11px; }

    .cal-day { padding: 8px 0; border-radius: 6px; background: var(--card-sub-bg); cursor: pointer; position: relative; transition: background 0.3s; }
    .cal-day.active { background: var(--accent-color); color: #fff; font-weight: bold; }
    .cal-day.has-done::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--success-color); border-radius: 50%; }

    /* Модальное окно Путеводителя (Onboarding) */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;

      -webkit-backdrop-filter: blur(8px);

</head>

      <div class="modal-buttons">

        <button class="primary-btn" style="flex:1; margin-bottom:0;" id="onboardingNextBtn" onclick="nextOnboardingStep()">Далее</button>
      </div>
    </div>
  </div>

  <!-- Вкладка Задач -->

      <button class="sub-tab-btn" onclick="switchTaskSubTab(event, 'calendarTasks')" id="subTabCalendar">📅 Календарь</button>
      <button class="sub-tab-btn" onclick="switchTaskSubTab(event, 'archiveTasks')" id="subTabArchive">📂 Архив</button>
    </div>

    <!-- Форма создания задачи -->
    <div class="task-add-box" id="taskAddBox">
      <div class="input-row">
        <select id="taskCategorySelect" style="flex: 1;" onchange="updateTemplates()"></select>
        <input type="date" id="taskDueDate">
      </div>

      <input type="text" id="taskInput" placeholder="Введите название задачи..." style="width: 100%; margin-bottom: 8px;">
      
      <select id="templateSelect" onchange="applyTemplate()" style="width: 100%; margin-bottom: 8px;">
        <option value="" id="templatePlaceholder">💡 Или выберите из готовых идей...</option>
      </select>

      <button class="primary-btn" onclick="addTask()" id="addBtn">Добавить задачу</button>
    </div>

    <!-- Вкладка: Активные задачи -->
    <div id="activeTasksSection">
      <ul class="task-list" id="activeTaskList"></ul>
    </div>

    <!-- Вкладка: Календарь -->
    <div id="calendarTasksSection" style="display: none;">
      <div class="calendar-card">
        <div class="calendar-header">
          <button class="btn-toggle" onclick="changeMonth(-1)">&lt;</button>
          <span id="calMonthYear">Октябрь 2026</span>
          <button class="btn-toggle" onclick="changeMonth(1)">&gt;</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
      
      <div style="font-size: 12px; font-weight: bold; margin-bottom: 8px; color: var(--accent-color);" id="calSelectedDateTitle">Задачи на выбранную дату:</div>
      <ul class="task-list" id="calendarTaskList"></ul>
    </div>

    <!-- Вкладка: Архив -->
    <div id="archiveTasksSection" style="display: none;">
      <div style="margin-bottom: 10px;">
        <select id="archiveFilterSelect" onchange="changeArchiveFilter(this.value)" style="width: 100%;">
          <option value="all" id="archOptAll">📂 Все время</option>
          <option value="today" id="archOptToday">📅 За сегодня</option>
          <option value="week" id="archOptWeek">🗓 За 7 дней</option>
          <option value="month" id="archOptMonth">📊 За месяц</option>
          <option value="year" id="archOptYear">⏳ Год назад</option>
        </select>
      </div>

      <ul class="task-list" id="archiveTaskList"></ul>
    </div>

  </div>

        emptyArchive: 'В архіві порожньо',
        calSelectedTitle: 'Завдання на обрану дату:',
        checkTitle: 'Позначити виконаним',
        guideBtn: '📖 Відкрити путівник (КПТ)',
        langBtn: '🌐 RU',
        categories: ['Робота', 'Сім’я', 'Друзі', 'Хобі', 'Відпочинок', 'Здоров’я', 'Духовність', 'Саморозвиток'],
        onboarding: [
          {
            title: '🧠 Навіщо потрібне Колесо Балансу?',
            text: 'З погляду КПТ (когнітивно-поведінкової терапії), наш мозок часто зациклюється на одній сфері (наприклад, роботі), ігноруючи інші. Це викликає вигорання. Оцінка сфер допомагає повернути об’єктивний погляд.'
          },
          {
            title: '🎯 Синдром "все або нічого"',
            text: 'Часто ми ставимо завеликі цілі, лякаємо мозок і прокрастинуємо. Метод мікро-кроків (по 5-10 хвилин) знижує тривогу та активує дофаминову систему без перевантаження.'
          },
          {
            title: '📅 Календар та Архів перемог',
            text: 'Фіксація навіть маленьких кроків зміцнює нові нейронні зв’язки та доводить вам, що ви рухаєтеся вперед. Почнімо!'
          }
        ],
        descriptions: [
          { name: '1. Робота та Кар’єра', desc: 'Професійна самореалізація та соціальна затребуваність.' },
          { name: '2. Сім’я та Близькі', desc: 'Зона емоційної безпеки, любові та глибокої прив’язаності.' },
          { name: '3. Друзі та Оточення', desc: 'Соціальне коло однодумців та взаємна підтримка.' },
          { name: '4. Хобі та Творчість', desc: 'Діяльність із компонента «ХОЧУ», що дає дофаміновий ресурс.' },
          { name: '5. Відпочинок та Відновлення', desc: 'Психогігієна та профілактика емоційного вигорання.' },
          { name: '6. Здоров’я та Тіло', desc: 'Сон, харчування, спорт та увага до сигналів тіла.' },
          { name: '7. Духовність та Сенс', desc: 'Відчуття призначення та відповіді на екзистенційні питання.' },
          { name: '8. Саморазвиток та Зростання', desc: 'Вивчення нового, розширення кругозору та робота з мисленням.' }
        ],
        templates: {
          'Робота': ['Очистити робочий стіл', 'Скласти 3 пріоритети', 'Зафіксувати досягнення'],
          'Сім’я': ['Написати близькому', 'Спілкування без телефонів', 'Подякувати рідним'],
          'Друзі': ['Надіслати спогад другу', 'Запланувати зустріч', 'Дізнатися справи'],
          'Хобі': ['Приділити 10 хв хобі', 'Подивитися урок', 'Замовити матеріали'],
          'Відпочинок': ['Цифровий детокс 10 хв', 'Побути в тиші', 'Лягти раніше на 30 хв'],
          'Здоров’я': ['Випити склянку води', 'Зробити розминку', 'Записатися до лікаря'],
          'Духовність': ['Записати 3 вдячності', 'Помедитувати', 'Зробити добру справу'],
          'Саморазвиток': ['Прочитати 5 сторінок', 'Виписати інсайт', 'Повчити слова']
        }
      }
    };

    let scores = JSON.parse(localStorage.getItem('streletskayaThemeScores')) || [5, 5, 5, 5, 5, 5, 5, 5];
    let taskList = JSON.parse(localStorage.getItem('streletskayaThemeTasksV3')) || JSON.parse(localStorage.getItem('streletskayaThemeTasksV2')) || [];
    
    let activeSubTab = 'activeTasks';
    let currentCalDate = new Date();
    let selectedCalDayStr = new Date().toISOString().split('T')[0];
    let archiveFilterMode = 'all';

    let onboardingStep = 0;

    document.getElementById('taskDueDate').value = selectedCalDayStr;

    // Плавный переход с прелестным блюром
    function applySmoothTransition(updateCallback) {
      document.body.classList.add('is-blur');
      setTimeout(() => {
        updateCallback();
        setTimeout(() => {
          document.body.classList.remove('is-blur');
        }, 80);
      }, 250);
    }

    // Логика путеводителя
    function checkFirstVisit() {
      const hasVisited = localStorage.getItem('streletskayaVisited');
      if (!hasVisited) {
        showOnboarding(false);
      }
    }

    window.showOnboarding = function(manual = true) {
      onboardingStep = 0;
      updateOnboardingContent();
      document.getElementById('onboardingModal').classList.add('show');
      if (!manual) {
        localStorage.setItem('streletskayaVisited', 'true');
      }
    };

    window.nextOnboardingStep = function() {
      const t = translations[currentLang];
      onboardingStep++;
      if (onboardingStep < t.onboarding.length) {
        updateOnboardingContent();
      } else {
        closeOnboarding();
      }
    };

    window.closeOnboarding = function() {
      document.getElementById('onboardingModal').classList.remove('show');
    };

    function updateOnboardingContent() {
      const t = translations[currentLang];
      const stepData = t.onboarding[onboardingStep];
      document.getElementById('onboardingStepIndicator').innerText = `${currentLang === 'ru' ? 'Шаг' : 'Крок'} ${onboardingStep + 1} ${currentLang === 'ru' ? 'из' : 'з'} ${t.onboarding.length}`;
      document.getElementById('onboardingTitle').innerText = stepData.title;
      document.getElementById('onboardingText').innerText = stepData.text;
      document.getElementById('onboardingNextBtn').innerText = onboardingStep === t.onboarding.length - 1 ? (currentLang === 'ru' ? 'Начать' : 'Розпочати') : (currentLang === 'ru' ? 'Далее' : 'Далі');
      document.getElementById('onboardingSkipBtn').innerText = currentLang === 'ru' ? 'Пропустить' : 'Пропустити';
    }

    window.openTab = function(evt, tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    };

    window.switchTaskSubTab = function(evt, subTabId) {
      activeSubTab = subTabId;
      document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.classList.remove('active'));
      evt.currentTarget.classList.add('active');

      document.getElementById('taskAddBox').style.display = subTabId === 'calendarTasks' ? 'none' : 'block';

      document.getElementById('activeTasksSection').style.display = subTabId === 'activeTasks' ? 'block' : 'none';
      document.getElementById('calendarTasksSection').style.display = subTabId === 'calendarTasks' ? 'block' : 'none';
      document.getElementById('archiveTasksSection').style.display = subTabId === 'archiveTasks' ? 'block' : 'none';

      renderTasksTab();
    };

    window.toggleTheme = function() {
      applySmoothTransition(() => {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('appTheme', currentTheme);
        applyTheme();
      });
    };

    function applyTheme() {
      if (currentTheme === 'light') {
        document.body.classList.add('light-theme');
        document.getElementById('themeBtn').innerText = '☀️';
      } else {
        document.body.classList.remove('light-theme');
        document.getElementById('themeBtn').innerText = '🌙';
      }
      updateChartColors();
    }

    window.toggleLanguage = function() {
      applySmoothTransition(() => {
        currentLang = currentLang === 'ru' ? 'ua' : 'ru';
        localStorage.setItem('appLang', currentLang);
        applyLanguage();
      });
    };

    function applyLanguage() {
      const t = translations[currentLang];
      document.getElementById('appTitle').innerText = t.appTitle;
      document.getElementById('tab1').innerText = t.tab1;
      document.getElementById('tab2').innerText = t.tab2;
      document.getElementById('tab3').innerText = t.tab3;
      
      document.getElementById('subTabActive').innerText = t.subTabActive;
      document.getElementById('subTabCalendar').innerText = t.subTabCalendar;
      document.getElementById('subTabArchive').innerText = t.subTabArchive;

      document.getElementById('taskInput').placeholder = t.taskInputPlaceholder;
      document.getElementById('addBtn').innerText = t.addBtn;
      document.getElementById('langBtn').innerText = t.langBtn;
      document.getElementById('guideBtn').innerText = t.guideBtn;

      document.getElementById('archOptAll').innerText = t.archOptAll;
      document.getElementById('archOptToday').innerText = t.archOptToday;
      document.getElementById('archOptWeek').innerText = t.archOptWeek;
      document.getElementById('archOptMonth').innerText = t.archOptMonth;
      document.getElementById('archOptYear').innerText = t.archOptYear;

      document.getElementById('calSelectedDateTitle').innerText = t.calSelectedTitle;

      const infoContainer = document.getElementById('infoCardsContainer');
      infoContainer.innerHTML = '';
      t.descriptions.forEach(item => {
        const card = document.createElement('div');
        card.className = 'info-card';
        card.innerHTML = `<h4>${item.name}</h4><p>${item.desc}</p>`;
        infoContainer.appendChild(card);
      });

      wheelChart.data.labels = t.categories;
      wheelChart.update();

      updateSlidersAndChart();

      const select = document.getElementById('taskCategorySelect');
      const selectedIndex = select.value || 0;
      select.innerHTML = '';
      t.categories.forEach((cat, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = cat;
        select.appendChild(opt);
      });
      select.value = selectedIndex;

      renderTasksTab();
    }

    const ctx = document.getElementById('wheelChart').getContext('2d');
    const wheelChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: [],
        datasets: [{
          label: 'Уровень',
          data: scores,
          backgroundColor: 'rgba(55, 151, 240, 0.35)',
          borderColor: '#3797f0',
          borderWidth: 2,
          pointBackgroundColor: '#3797f0'
        }]
      },
      options: {
        scales: {
          r: {
            min: 0, max: 10,
            ticks: { display: false },
            grid: { color: 'rgba(255, 255, 255, 0.25)' },
            angleLines: { color: 'rgba(255, 255, 255, 0.25)' },
            pointLabels: { color: '#ffffff', font: { size: 12, weight: 'bold' } }
          }
        },
        plugins: { legend: { display: false } }
      }
    });

    window.updateSlidersAndChart = function() {
      const t = translations[currentLang];
      const slidersContainer = document.getElementById('slidersContainer');
      slidersContainer.innerHTML = '';
      t.categories.forEach((cat, index) => {
        const group = document.createElement('div');
        group.className = 'slider-group';
        group.innerHTML = `
          <label>${cat}</label>
          <input type="range" min="1" max="10" value="${scores[index]}" oninput="updateScore(${index}, this.value)">
          <span id="val-${index}">${scores[index]}</span>
        `;
        slidersContainer.appendChild(group);
      });
      wheelChart.data.datasets[0].data = scores;
      wheelChart.update();
    };

    function updateChartColors() {
      const isLight = currentTheme === 'light';
      wheelChart.options.scales.r.pointLabels.color = isLight ? '#121212' : '#ffffff';
      wheelChart.options.scales.r.grid.color = isLight ? 'rgba(0, 0, 0, 0.15)' : 'rgba(255, 255, 255, 0.25)';
      wheelChart.options.scales.r.angleLines.color = isLight ? 'rgba(0, 0, 0, 0.15)' : 'rgba(255, 255, 255, 0.25)';
      wheelChart.update();
    }

    window.updateScore = function(index, value) {
      scores[index] = Number(value);
      document.getElementById(`val-${index}`).innerText = value;
      wheelChart.data.datasets[0].data = scores;
      wheelChart.update();
      if (typeof window.saveUserData === 'function') {
        window.saveUserData(scores, taskList);
      }
    };

    window.updateTemplates = function() {
      const t = translations[currentLang];
      const categoryIndex = document.getElementById('taskCategorySelect').value || 0;
      const categoryName = t.categories[categoryIndex];
      const templateSelect = document.getElementById('templateSelect');
      
      templateSelect.innerHTML = `<option value="">${t.templatePlaceholder}</option>`;
      
      if (t.templates[categoryName]) {
        t.templates[categoryName].forEach(tmpl => {
          const opt = document.createElement('option');
          opt.value = tmpl;
          opt.textContent = tmpl;
          templateSelect.appendChild(opt);
        });
      }
    };

    window.applyTemplate = function() {
      const templateSelect = document.getElementById('templateSelect');
      const taskInput = document.getElementById('taskInput');
      if (templateSelect.value) {
        taskInput.value = templateSelect.value;
      }
    };

    window.addTask = function() {
      const catIdx = document.getElementById('taskCategorySelect').value || 0;
      const input = document.getElementById('taskInput');
      const dateVal = document.getElementById('taskDueDate').value || new Date().toISOString().split('T')[0];
      const text = input.value.trim();

      if (!text) return;

      const newTask = {
        id: Date.now().toString(),
        text: text,
        catIndex: Number(catIdx),
        completed: false,
        createdAt: dateVal,
        completedAt: null
      };

      taskList.push(newTask);
      input.value = '';
      document.getElementById('templateSelect').value = '';

      renderTasksTab();
      if (typeof window.saveUserData === 'function') {
        window.saveUserData(scores, taskList);
      }
    };

    window.toggleTask = function(taskId) {
      const task = taskList.find(t => t.id === taskId);
      if (task) {
        task.completed = !task.completed;
        task.completedAt = task.completed ? new Date().toISOString().split('T')[0] : null;
        renderTasksTab();
        if (typeof window.saveUserData === 'function') {
          window.saveUserData(scores, taskList);
        }
      }
    };

    window.deleteTask = function(taskId) {
      taskList = taskList.filter(t => t.id !== taskId);
      renderTasksTab();
      if (typeof window.saveUserData === 'function') {
        window.saveUserData(scores, taskList);
      }
    };

    function renderTasksTab() {
      updateTemplates();
      if (activeSubTab === 'activeTasks') renderActiveTasks();
      else if (activeSubTab === 'calendarTasks') renderCalendarView();
      else if (activeSubTab === 'archiveTasks') renderArchiveTasks();
    }

    function renderActiveTasks() {
      const listEl = document.getElementById('activeTaskList');
      listEl.innerHTML = '';
      const t = translations[currentLang];

      const activeList = taskList.filter(t => !t.completed);

      if (activeList.length === 0) {
        listEl.innerHTML = `<li style="font-size:13px; color:var(--subtext-color); text-align:center; padding:15px;">${t.emptyTasks}</li>`;
        return;
      }

      activeList.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item';
        li.innerHTML = `
          <button class="check-btn" onclick="toggleTask('${task.id}')" title="${t.checkTitle}">✓</button>
          <span class="task-cat-badge">${t.categories[task.catIndex]}</span>
          <span class="task-text" onclick="toggleTask('${task.id}')" style="cursor:pointer;">${task.text}</span>
          <button class="delete-btn" onclick="deleteTask('${task.id}')">&times;</button>
        `;
        listEl.appendChild(li);
      });
    }

    window.changeMonth = function(delta) {
      currentCalDate.setMonth(currentCalDate.getMonth() + delta);
      renderCalendarView();
    };

    function renderCalendarView() {
      const year = currentCalDate.getFullYear();
      const month = currentCalDate.getMonth();
      const t = translations[currentLang];

      const monthNames = currentLang === 'ru' 
        ? ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь']
        : ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
      
      document.getElementById('calMonthYear').innerText = `${monthNames[month]} ${year}`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const dayHeads = currentLang === 'ru' ? ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'] : ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
      dayHeads.forEach(d => {
        const div = document.createElement('div');
        div.className = 'cal-day-head';
        div.innerText = d;
        grid.appendChild(div);
      });

      const firstDayIdx = (new Date(year, month, 1).getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayIdx; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const div = document.createElement('div');
        div.className = `cal-day ${dateStr === selectedCalDayStr ? 'active' : ''}`;
        
        const hasDone = taskList.some(t => t.completedAt === dateStr);
        if (hasDone) div.classList.add('has-done');

        div.innerText = day;
        div.onclick = () => {
          selectedCalDayStr = dateStr;
          renderCalendarView();
        };
        grid.appendChild(div);
      }

      const dayTasks = taskList.filter(t => t.createdAt === selectedCalDayStr || t.completedAt === selectedCalDayStr);
      const listEl = document.getElementById('calendarTaskList');
      listEl.innerHTML = '';

      if (dayTasks.length === 0) {
        listEl.innerHTML = `<li style="font-size:12px; color:var(--subtext-color); text-align:center; padding:10px;">${t.emptyCalendar}</li>`;
        return;
      }

      dayTasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <button class="check-btn" onclick="toggleTask('${task.id}')" title="${t.checkTitle}">✓</button>
          <span class="task-cat-badge">${t.categories[task.catIndex]}</span>
          <span class="task-text" onclick="toggleTask('${task.id}')" style="cursor:pointer;">${task.text}</span>
          <button class="delete-btn" onclick="deleteTask('${task.id}')">&times;</button>
        `;
        listEl.appendChild(li);
      });
    }

    window.changeArchiveFilter = function(mode) {
      archiveFilterMode = mode;
      renderArchiveTasks();
    };

    function renderArchiveTasks() {
      const listEl = document.getElementById('archiveTaskList');
      listEl.innerHTML = '';
      const t = translations[currentLang];

      let completedTasks = taskList.filter(t => t.completed);
      const now = new Date();

      if (archiveFilterMode === 'today') {
        const todayStr = now.toISOString().split('T')[0];
        completedTasks = completedTasks.filter(t => t.completedAt === todayStr);
      } else if (archiveFilterMode === 'week') {
        const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
        completedTasks = completedTasks.filter(t => new Date(t.completedAt) >= weekAgo);
      } else if (archiveFilterMode === 'month') {
        const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
        completedTasks = completedTasks.filter(t => new Date(t.completedAt) >= monthAgo);
      } else if (archiveFilterMode === 'year') {
        const yearAgoStr = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate()).toISOString().split('T')[0];
        completedTasks = completedTasks.filter(t => t.completedAt === yearAgoStr);
      }

      if (completedTasks.length === 0) {
        listEl.innerHTML = `<li style="font-size:12px; color:var(--subtext-color); text-align:center; padding:15px;">${t.emptyArchive}</li>`;
        return;
      }

      completedTasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item completed';
        li.innerHTML = `
          <button class="check-btn" onclick="toggleTask('${task.id}')" title="${t.checkTitle}">✓</button>
          <span class="task-cat-badge">${t.categories[task.catIndex]}</span>
          <span class="task-text">${task.text}</span>
          <button class="delete-btn" onclick="deleteTask('${task.id}')">&times;</button>
        `;
        listEl.appendChild(li);
      });
    }

    // Инициализация при старте с мягким блюром
    applyTheme();
    applyLanguage();
    checkFirstVisit();
  </script>
</body>
</html>
