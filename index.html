<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Колесо баланса по Е. Стрелецкой</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }
    
    /* Вкладки */
    .nav-tabs {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid #e0e0e0;
      margin-bottom: 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      border: none;
      background: none;
      font-size: 12px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      text-align: center;
    }
    .tab-btn.active {
      color: #2481cc;
      border-bottom-color: #2481cc;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .chart-container { position: relative; width: 100%; max-width: 380px; margin: 0 auto; }
    .slider-group { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .slider-group label { font-size: 13px; flex: 1; font-weight: 500; }
    .slider-group input { width: 40%; }
    .slider-group span { width: 25px; text-align: right; font-weight: bold; }

    /* Раскрывающиеся карточки в Описании */
    .info-card {
      background: rgba(0,0,0,0.03);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      border-left: 4px solid #2481cc;
    }
    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .info-card h4 { margin: 0; color: #2481cc; font-size: 14px; }
    .info-card p { margin: 6px 0 0 0; font-size: 12px; line-height: 1.4; color: #333; }
    
    .examples-container {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #ccc;
    }
    .examples-container.open { display: block; }
    .example-item {
      font-size: 12px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #eee;
    }
    .add-example-btn {
      background: #2481cc;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
    }

    /* Задачи */
    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .primary-btn {
      width: 100%;
      padding: 10px;
      background-color: #2481cc;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .task-list { list-style: none; padding: 0; margin-top: 10px; }
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.03);
      padding: 8px;
      margin-bottom: 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    .task-item.completed span { text-decoration: line-through; color: gray; }
    .delete-btn { background: none; border: none; color: #ff4d4d; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="openTab(event, 'wheelTab')">📊 Колесо</button>
    <button class="tab-btn" onclick="openTab(event, 'infoTab')">📖 Описание и 10 Задач</button>
    <button class="tab-btn" onclick="openTab(event, 'tasksTab')">✅ Мои Задачи</button>
  </div>

  <!-- Вкладка 1: Диаграмма -->
  <div id="wheelTab" class="tab-content active">
    <div class="chart-container">
      <canvas id="wheelChart"></canvas>
    </div>
    <div class="sliders" id="slidersContainer" style="margin-top:15px;"></div>
  </div>

  <!-- Вкладка 2: Описание сфер и 10 примеров -->
  <div id="infoTab" class="tab-content">
    <div id="infoCardsContainer"></div>
  </div>

  <!-- Вкладка 3: Мои задачи -->
  <div id="tasksTab" class="tab-content">
    <select id="taskCategorySelect"></select>
    <input type="text" id="taskInput" placeholder="Введите задачу...">
    <button class="primary-btn" onclick="addTask()">Добавить задачу</button>
    <ul class="task-list" id="taskList"></ul>
  </div>

  <script>

        ]
      },
      {
        name: 'Хобби',
        desc: 'Творчество, личные увлечения и любимые занятия, приносящие чистую радость.',
        tasks: [

          'Попробовать 1 новое творческое занятие',
          'Купить необходимые материалы для хобби',
          'Записаться на мастер-класс или пробный урок',
          'Посмотреть обучающее видео по своему хобби',
          'Завершить давно начатый творческий проект',
          'Оборудовать удобное место под хобби дома',

          'Сделать что-то своими руками',
          'Поделиться результатом хобби с близкими'
        ]
      },
      {
        name: 'Отдых',
        desc: 'Восстановление ресурса, соблюдение психогигиены и смена обстановки.',
        tasks: [
          'Устроить 1 час абсолютного «цифрового детокса»',

        ]
      },
      {
        name: 'Здоровье',
        desc: 'Физическое самочувствие, режим сна, спорт, питание и медицинский контроль.',
        tasks: [
          'Записаться на плановый осмотр к врачу',
          'Сделать 15-минутную разминку или зарядку',
          'Выпить 1.5 литра чистой воды за день',
          'Заменить фастфуд на сбалансированный обед',
          'Пройти 8 000 шагов за день',
          'Сдать базовые анализы крови',
          'Купить качественные витамины после консультации',
          'Сделать дыхательную гимнастику от стресса',
          'Наладить стабильный режим подъема и отбоя',
          'Ограничить употребление кофе и сахара'
        ]
      },
      {
        name: 'Духовность',
        desc: 'Экзистенциальные ценности, понимание своего предназначения и осмысленность жизни.',
        tasks: [
          'Выписать 5 главных ценностей в жизни',
          'Помедитировать или побыть в тишине 10 минут',
          'Записать 3 вещи, за которые вы благодарны сегодня',
          'Сделать 1 бескорыстное доброе дело',
          'Поразмышлять над своими долгосрочными смысловыми целями',
          'Прочитать главу философии или психологии',
          'Определить свои личные границы',
          'Простить давнюю обиду или отпустить ситуацию',
          'Провести рефлексию своего поведения за неделю',
          'Написать письмо себе в будущее'
        ]
      },
      {
        name: 'Саморазвитие',
        desc: 'Обучение, новые навыки, расширение кругозора и работа с мышлением.',
        tasks: [
          'Прочитать 15 страниц полезной книги',
          'Посмотреть 1 научно-популярную лекцию',
          'Позаниматься иностранным языком 15 минут',
          'Освоить 1 новую горячую клавишу или инструмент',
          'Прослушать познавательный подкаст',
          'Записать 3 главных инсайта за день',
          'Поработать над 1 когнитивным искажением',
          'Изучить новую тему из смежной сферы',
          'Записаться на курс по развитию навыков',
          'Разложить сложную задачу на микро-шаги'
        ]
      }
    ];

    const categories = spheresData.map(s => s.name);
    let scores = JSON.parse(localStorage.getItem('streletskayaYT8Scores')) || [5, 5, 5, 5, 5, 5, 5, 5];
    let tasks = JSON.parse(localStorage.getItem('streletskayaYT8Tasks')) || {};

    categories.forEach(cat => { if (!tasks[cat]) tasks[cat] = []; });

    function openTab(evt, tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    }

    // Рендер 8 сфер и карточек примеров
    const infoContainer = document.getElementById('infoCardsContainer');
    spheresData.forEach((s, sIdx) => {
      const card = document.createElement('div');
      card.className = 'info-card';
      
      let examplesHTML = s.tasks.map(t => `
        <div class="example-item">
          <span>• ${t}</span>
          <button class="add-example-btn" onclick="addSuggestedTask('${s.name}', '${t.replace(/'/g, "\\'")}')">+ В задачи</button>
        </div>
      `).join('');

      card.innerHTML = `
        <div class="info-header" onclick="toggleExamples(${sIdx})">
          <h4>${sIdx + 1}. ${s.name}</h4>
          <span id="arrow-${sIdx}" style="font-size:12px; color:#2481cc;">▼ 10 задач</span>
        </div>
        <p>${s.desc}</p>
        <div class="examples-container" id="examples-${sIdx}">
          ${examplesHTML}
        </div>
      `;
      infoContainer.appendChild(card);
    });

    function toggleExamples(idx) {
      const el = document.getElementById(`examples-${idx}`);
      const arrow = document.getElementById(`arrow-${idx}`);
      el.classList.toggle('open');
      arrow.innerText = el.classList.contains('open') ? '▲ Скрыть' : '▼ 10 задач';
    }

    function addSuggestedTask(cat, text) {
      tasks[cat].push({ text, completed: false });
      localStorage.setItem('streletskayaYT8Tasks', JSON.stringify(tasks));
      alert(`Задача добавлена в сферу "${cat}"!`);
      renderTasks();
    }

    // График Chart.js
    const ctx = document.getElementById('wheelChart').getContext('2d');
    const wheelChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: categories,
        datasets: [{
          label: 'Оценка сферы',
          data: scores,
          backgroundColor: 'rgba(36, 129, 204, 0.25)',
          borderColor: 'rgba(36, 129, 204, 1)',
          borderWidth: 2
        }]
      },
      options: {
        scales: { r: { min: 0, max: 10, ticks: { stepSize: 2 } } },
        plugins: { legend: { display: false } }
      }
    });

    // Ползунки
    const slidersContainer = document.getElementById('slidersContainer');
    categories.forEach((cat, index) => {
      const group = document.createElement('div');
      group.className = 'slider-group';
      group.innerHTML = `
        <label>${cat}</label>
        <input type="range" min="1" max="10" value="${scores[index]}" oninput="updateScore(${index}, this.value)">
        <span id="val-${index}">${scores[index]}</span>
      `;
      slidersContainer.appendChild(group);
    });

    const select = document.getElementById('taskCategorySelect');
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });

    function updateScore(index, value) {
      scores[index] = Number(value);
      document.getElementById(`val-${index}`).innerText = value;
      wheelChart.data.datasets[0].data = scores;
      wheelChart.update();
      localStorage.setItem('streletskayaYT8Scores', JSON.stringify(scores));
    }

    function renderTasks() {
      const selectedCat = select.value;
      const listEl = document.getElementById('taskList');
      listEl.innerHTML = '';
      
      (tasks[selectedCat] || []).forEach((task, idx) => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <label style="display:flex; align-items:center; gap:8px; flex:1;">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${selectedCat}', ${idx})">
            <span>${task.text}</span>
          </label>
          <button class="delete-btn" onclick="deleteTask('${selectedCat}', ${idx})">×</button>
        `;
        listEl.appendChild(li);
      });
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      const selectedCat = select.value;
      if (!text) return;

      tasks[selectedCat].push({ text, completed: false });
      input.value = '';
      localStorage.setItem('streletskayaYT8Tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function toggleTask(cat, idx) {
      tasks[cat][idx].completed = !tasks[cat][idx].completed;
      localStorage.setItem('streletskayaYT8Tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function deleteTask(cat, idx) {
      tasks[cat].splice(idx, 1);
      localStorage.setItem('streletskayaYT8Tasks', JSON.stringify(tasks));
      renderTasks();
    }

    select.onchange = renderTasks;
    renderTasks();
  </script>
</body>
</html>

    renderTasks();
  </script>
</body>
</html>
