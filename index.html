<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Колесо Баланса по Е. Стрелецкой</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAdypqxdS_w2bp_ubPg4_9YoNXq7HLIBIE",
      authDomain: "life-wheel-5e119.firebaseapp.com",
      projectId: "life-wheel-5e119",
      storageBucket: "life-wheel-5e119.firebasestorage.app",
      messagingSenderId: "1044261685647",
      appId: "1:1044261685647:web:350a3d2f821c4052e0e3fa",
      measurementId: "G-RM1ZL6WJ4Q"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.loginWithGoogle = function() {
      signInWithPopup(auth, provider).catch((error) => console.error(error));
    };

    window.logoutFromGoogle = function() {
      signOut(auth);
    };

    onAuthStateChanged(auth, async (user) => {
      const authBtn = document.getElementById('authBtn');
      const userAvatar = document.getElementById('userAvatar');
      
      if (user) {
        authBtn.innerText = `Выйти (${user.displayName.split(' ')[0]})`;
        authBtn.onclick = window.logoutFromGoogle;
        if(user.photoURL) {
          userAvatar.src = user.photoURL;
          userAvatar.style.display = 'block';
        }
        await loadUserData(user.uid);
      } else {
        authBtn.innerText = '🌐 Войти через Google';
        authBtn.onclick = window.loginWithGoogle;
        userAvatar.style.display = 'none';
      }
    });

    window.saveUserData = async function(newScores, newTasks) {
      const user = auth.currentUser;
      if (!user) {
        localStorage.setItem('streletskayaThemeScores', JSON.stringify(newScores));
        localStorage.setItem('streletskayaThemeTasks', JSON.stringify(newTasks));
        return;
      }
      try {
        await setDoc(doc(db, "users", user.uid), {
          scores: newScores,
          tasks: newTasks,
          updatedAt: new Date()
        });
      } catch (e) {
        console.error("Ошибка сохранения в облако: ", e);
      }
    };

    async function loadUserData(uid) {
      try {
        const docRef = doc(db, "users", uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.scores) {
            scores = data.scores;
            updateSlidersAndChart();
          }
          if (data.tasks) {
            tasks = data.tasks;
            renderTasks();
          }
        }
      } catch (e) {
        console.error("Ошибка загрузки из облака: ", e);
      }
    }
  </script>

  <style>
    :root {
      --bg-color: #121212;
      --text-color: #ffffff;
      --card-bg: #1e1e1e;
      --accent-color: #3797f0;
      --accent-text: #ffffff;
      --border-color: rgba(255, 255, 255, 0.15);
      --subtext-color: #b0b0b0;
    }

    body.light-theme {
      --bg-color: #ffffff;
      --text-color: #121212;
      --card-bg: #f4f5f7;
      --accent-color: #2481cc;
      --accent-text: #ffffff;
      --border-color: rgba(0, 0, 0, 0.12);
      --subtext-color: #666666;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0; padding: 12px; box-sizing: border-box;
      transition: background-color 0.3s, color 0.3s;
      -webkit-tap-highlight-color: transparent;
    }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header-controls { display: flex; gap: 6px; align-items: center; }
    .btn-toggle {
      background: var(--card-bg); color: var(--text-color);
      border: 1px solid var(--border-color); padding: 6px 10px;
      border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer;
    }
    .user-avatar { width: 24px; height: 24px; border-radius: 50%; display: none; }

    .nav-tabs { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px 2px; border: none; background: none; font-size: 12px; font-weight: bold; color: var(--subtext-color); cursor: pointer; border-bottom: 3px solid transparent; text-align: center; }
    .tab-btn.active { color: var(--accent-color); border-bottom-color: var(--accent-color); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .chart-container { position: relative; width: 100%; max-width: 380px; margin: 0 auto; }
    .slider-group { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .slider-group label { font-size: 13px; flex: 1; font-weight: 500; }
    .slider-group input { width: 40%; accent-color: var(--accent-color); }
    .slider-group span { width: 25px; text-align: right; font-weight: bold; color: var(--accent-color); }

    .info-card { background: var(--card-bg); border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border-color); border-left: 4px solid var(--accent-color); }
    .info-card h4 { margin: 0 0 6px 0; color: var(--accent-color); font-size: 14px; }
    .info-card p { margin: 0; font-size: 12px; line-height: 1.4; color: var(--text-color); }

    .progress-box { background: var(--card-bg); border-radius: 8px; padding: 10px; margin-bottom: 12px; border: 1px solid var(--border-color); }
    .progress-bar-bg { background: var(--border-color); height: 8px; border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .progress-bar-fill { background: var(--accent-color); height: 100%; width: 0%; transition: width 0.3s ease; }
    .progress-text { font-size: 12px; font-weight: bold; display: flex; justify-content: space-between; }

    select, input[type="text"] { width: 100%; padding: 10px; margin-bottom: 8px; box-sizing: border-box; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); font-size: 13px; }
    .primary-btn { width: 100%; padding: 10px; background-color: var(--accent-color); color: var(--accent-text); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    .filter-box { display: flex; gap: 6px; margin-bottom: 10px; }
    .filter-btn { flex: 1; padding: 6px; font-size: 11px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--subtext-color); border-radius: 6px; cursor: pointer; }
    .filter-btn.active { background: var(--accent-color); color: var(--accent-text); border-color: var(--accent-color); }

    .task-list { list-style: none; padding: 0; margin: 0; }
    .task-item { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 10px; margin-bottom: 6px; border-radius: 8px; font-size: 13px; border: 1px solid var(--border-color); }
    .task-item.completed span { text-decoration: line-through; color: var(--subtext-color); }
    .delete-btn { background: none; border: none; color: #ff5252; cursor: pointer; font-weight: bold; font-size: 16px; }
  </style>
</head>
<body>

  <div class="header-bar">
    <span style="font-weight: bold; font-size: 14px;" id="appTitle">📊 Колесо Баланса</span>
    <div class="header-controls">
      <img id="userAvatar" class="user-avatar" alt="User">
      <button class="btn-toggle" id="authBtn">🌐 Войти</button>
      <button class="btn-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
      <button class="btn-toggle" onclick="toggleLanguage()" id="langBtn">🌐 UA</button>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="openTab(event, 'wheelTab')" id="tab1">📊 Колесо</button>
    <button class="tab-btn" onclick="openTab(event, 'infoTab')" id="tab2">📖 Описание</button>
    <button class="tab-btn" onclick="openTab(event, 'tasksTab')" id="tab3">✅ Задачи</button>
  </div>

  <div id="wheelTab" class="tab-content active">
    <div class="chart-container">
      <canvas id="wheelChart"></canvas>
    </div>
    <div class="sliders" id="slidersContainer" style="margin-top:15px;"></div>
  </div>

  <div id="infoTab" class="tab-content">
    <div id="infoCardsContainer"></div>
  </div>

  <div id="tasksTab" class="tab-content">
    <select id="taskCategorySelect" onchange="renderTasks()"></select>

    <div class="progress-box">
      <div class="progress-text">
        <span id="progressLabel">Прогресс сферы</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
    </div>

    <select id="templateSelect" onchange="applyTemplate()">
      <option value="" id="templatePlaceholder">💡 Выбрать микро-шаг...</option>
    </select>

    <input type="text" id="taskInput" placeholder="Или введите свою задачу...">
    <button class="primary-btn" onclick="addTask()" id="addBtn">Добавить микро-шаг</button>

    <div class="filter-box">
      <button class="filter-btn active" onclick="setFilter(event, 'all')" id="filterAll">Все</button>
      <button class="filter-btn" onclick="setFilter(event, 'active')" id="filterActive">В работе</button>
      <button class="filter-btn" onclick="setFilter(event, 'completed')" id="filterCompleted">Готово</button>
    </div>

    <ul class="task-list" id="taskList"></ul>
  </div>

  <script>
    let currentLang = localStorage.getItem('appLang') || 'ru';
    let currentTheme = localStorage.getItem('appTheme') || 'dark';

    const translations = {
      ru: {
        appTitle: '📊 Колесо Баланса',
        tab1: '📊 Колесо', tab2: '📖 Описание', tab3: '✅ Задачи',
        progressLabel: 'Прогресс сферы',
        templatePlaceholder: '💡 Выбрать готовый микро-шаг (5-10 мин)...',
        taskInputPlaceholder: 'Или введите свою задачу...',
        addBtn: 'Добавить микро-шаг',
        filterAll: 'Все', filterActive: 'В работе', filterCompleted: 'Готово',
        langBtn: '🌐 UA',
        categories: ['Работа', 'Семья', 'Друзья', 'Хобби', 'Отдых', 'Здоровье', 'Духовность', 'Саморазвитие'],
        descriptions: [
          { name: '1. Работа и Карьера', desc: 'Профессиональная самореализация и социальная востребованность.' },
          { name: '2. Семья и Близкие', desc: 'Зона эмоциональной безопасности, любви и глубокой привязанности.' },
          { name: '3. Друзья и Окружение', desc: 'Социальный круг единомышленников и взаимная поддержка.' },
          { name: '4. Хобби и Творчество', desc: 'Деятельность из компонента «ХОЧУ», дающая дофаминовый ресурс.' },
          { name: '5. Отдых и Восстановление', desc: 'Психогигиена и профилактика эмоционального выгорания.' },
          { name: '6. Здоровье и Тело', desc: 'Сон, питание, спорт и внимание к сигналам тела.' },
          { name: '7. Духовность и Смысл', desc: 'Ощущение предназначения и ответы на экзистенциальные вопросы.' },
          { name: '8. Саморазвитие и Рост', desc: 'Изучение нового, расширение кругозора и работа с мышлением.' }
        ],
        templates: {
          'Работа': ['Очистить рабочий стол', 'Составить 3 приоритета', 'Зафиксировать достижение'],
          'Семья': ['Написать близкому', 'Устроить общение без телефонов', 'Поблагодарить родных'],
          'Друзья': ['Отправить другу память', 'Запланировать встречу', 'Узнать как дела'],
          'Хобби': ['Уделить 10 минут увлечению', 'Посмотреть урок', 'Заказать материалы'],
          'Отдых': ['Цифровой детокс 10 мин', 'Побыть в тишине', 'Лечь раньше на 30 мин'],
          'Здоровье': ['Выпить стакан воды', 'Сделать разминку', 'Записаться к врачу'],
          'Духовность': ['Записать 3 благодарности', 'Помедитировать', 'Сделать доброе дело'],
          'Саморазвитие': ['Прочитать 5 страниц', 'Выписать инсайт', 'Поучить слова']
        }
      },
      ua: {
        appTitle: '📊 Колесо Балансу',
        tab1: '📊 Колесо', tab2: '📖 Опис', tab3: '✅ Завдання',
        progressLabel: 'Прогрес сфери',
        templatePlaceholder: '💡 Обрати мікро-крок (5-10 хв)...',
        taskInputPlaceholder: 'Або введіть своє завдання...',
        addBtn: 'Додати мікро-крок',
        filterAll: 'Усі', filterActive: 'В роботі', filterCompleted: 'Готово',
        langBtn: '🌐 RU',
        categories: ['Робота', 'Сім’я', 'Друзі', 'Хобі', 'Відпочинок', 'Здоров’я', 'Духовність', 'Саморозвиток'],
        descriptions: [
          { name: '1. Робота та Кар’єра', desc: 'Професійна самореалізація та соціальна затребуваність.' },
          { name: '2. Сім’я та Близькі', desc: 'Зона емоційної безпеки, любові та глибокої прив’язаності.' },
          { name: '3. Друзі та Оточення', desc: 'Соціальне коло однодумців та взаємна підтримка.' },
          { name: '4. Хобі та Творчість', desc: 'Діяльність із компонента «ХОЧУ», що дає дофаміновий ресурс.' },
          { name: '5. Відпочинок та Відновлення', desc: 'Психогігієна та профілактика емоційного вигорання.' },
          { name: '6. Здоров’я та Тіло', desc: 'Сон, харчування, спорт та увага до сигналів тіла.' },
          { name: '7. Духовність та Сенс', desc: 'Відчуття призначення та відповіді на екзистенційні питання.' },
          { name: '8. Саморазвиток та Зростання', desc: 'Вивчення нового, розширення кругозору та робота з мисленням.' }
        ],
        templates: {
          'Робота': ['Очистити робочий стіл', 'Скласти 3 пріоритети', 'Зафіксувати досягнення'],
          'Сім’я': ['Написати близькому', 'Спілкування без телефонов', 'Подякувати рідним'],
          'Друзі': ['Надіслати спогад другу', 'Запланувати зустріч', 'Дізнатися справи'],
          'Хобі': ['Приділити 10 хв хобі', 'Подивитися урок', 'Замовити матеріали'],
          'Відпочинок': ['Цифровий детокс 10 хв', 'Побути в тиші', 'Лягти раніше на 30 хв'],
          'Здоров’я': ['Випити склянку води', 'Зробити розминку', 'Записатися до лікаря'],
          'Духовність': ['Записати 3 вдячності', 'Помедитувати', 'Зробити добру справу'],
          'Саморазвитие': ['Прочитати 5 сторінок', 'Виписати інсайт', 'Повчити слова']
        }
      }
    };

    let scores = JSON.parse(localStorage.getItem('streletskayaThemeScores')) || [5, 5, 5, 5, 5, 5, 5, 5];
    let tasks = JSON.parse(localStorage.getItem('streletskayaThemeTasks')) || {};
    let currentFilter = 'all';

    window.openTab = function(evt, tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    };

    window.toggleTheme = function() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('appTheme', currentTheme);
      applyTheme();
    };

    function applyTheme() {
      if (currentTheme === 'light') {
        document.body.classList.add('light-theme');
        document.getElementById('themeBtn').innerText = '☀️';
      } else {
        document.body.classList.remove('light-theme');
        document.getElementById('themeBtn').innerText = '🌙';
      }
      updateChartColors();
    }

    window.toggleLanguage = function() {
      currentLang = currentLang === 'ru' ? 'ua' : 'ru';
      localStorage.setItem('appLang', currentLang);
      applyLanguage();
    };

    function applyLanguage() {
      const t = translations[currentLang];
      document.getElementById('appTitle').innerText = t.appTitle;
      document.getElementById('tab1').innerText = t.tab1;
      document.getElementById('tab2').innerText = t.tab2;
      document.getElementById('tab3').innerText = t.tab3;
      document.getElementById('progressLabel').innerText = t.progressLabel;
      document.getElementById('taskInput').placeholder = t.taskInputPlaceholder;
      document.getElementById('addBtn').innerText = t.addBtn;
      document.getElementById('filterAll').innerText = t.filterAll;
      document.getElementById('filterActive').innerText = t.filterActive;
      document.getElementById('filterCompleted').innerText = t.filterCompleted;
      document.getElementById('langBtn').innerText = t.langBtn;

      const infoContainer = document.getElementById('infoCardsContainer');
      infoContainer.innerHTML = '';
      t.descriptions.forEach(item => {
        const card = document.createElement('div');
        card.className = 'info-card';
        card.innerHTML = `<h4>${item.name}</h4><p>${item.desc}</p>`;
        infoContainer.appendChild(card);
      });

      wheelChart.data.labels = t.categories;
      wheelChart.update();

      updateSlidersAndChart();

      const select = document.getElementById('taskCategorySelect');
      const selectedCatIndex = select.value || 0;
      select.innerHTML = '';
      t.categories.forEach((cat, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = cat;
        select.appendChild(opt);
      });
      select.value = selectedCatIndex;

      renderTasks();
    }

    const ctx = document.getElementById('wheelChart').getContext('2d');
    const wheelChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: [],
        datasets: [{
          label: 'Уровень',
          data: scores,
          backgroundColor: 'rgba(55, 151, 240, 0.35)',
          borderColor: '#3797f0',
          borderWidth: 2,
          pointBackgroundColor: '#3797f0'
        }]
      },
      options: {
        scales: {
          r: {
            min: 0, max: 10,
            ticks: { display: false },
            grid: { color: 'rgba(255, 255, 255, 0.25)' },
            angleLines: { color: 'rgba(255, 255, 255, 0.25)' },
            pointLabels: { color: '#ffffff', font: { size: 12, weight: 'bold' } }
          }
        },
        plugins: { legend: { display: false } }
      }
    });

    window.updateSlidersAndChart = function() {
      const t = translations[currentLang];
      const slidersContainer = document.getElementById('slidersContainer');
      slidersContainer.innerHTML = '';
      t.categories.forEach((cat, index) => {
        const group = document.createElement('div');
        group.className = 'slider-group';
        group.innerHTML = `
          <label>${cat}</label>
          <input type="range" min="1" max="10" value="${scores[index]}" oninput="updateScore(${index}, this.value)">
          <span id="val-${index}">${scores[index]}</span>
        `;
        slidersContainer.appendChild(group);
      });
      wheelChart.data.datasets[0].data = scores;
      wheelChart.update();
    };

    function updateChartColors() {
      const isLight = currentTheme === 'light';
      wheelChart.options.scales.r.pointLabels.color = isLight ? '#121212' : '#ffffff';
      wheelChart.options.scales.r.grid.color = isLight ? 'rgba(0, 0, 0, 0.15)' : 'rgba(255, 255, 255, 0.25)';
      wheelChart.options.scales.r.angleLines.color = isLight ? 'rgba(0, 0, 0, 0.15)' : 'rgba(255, 255, 255, 0.25)';
      wheelChart.update();
    }

    window.updateScore = function(index, value) {
      scores[index] = Number(value);
      document.getElementById(`val-${index}`).innerText = value;
      wheelChart.data.datasets[0].data = scores;
      wheelChart.update();
      if (typeof window.saveUserData === 'function') {
        window.saveUserData(scores, tasks);
      }
    };

    function updateTemplates() {
      const t = translations[currentLang];
      const categoryIndex = document.getElementById('taskCategorySelect').value || 0;
      const categoryName = t.categories[categoryIndex];
      const templateSelect = document.getElementById('templateSelect');
      
      templateSelect.innerHTML = `<option value="">${t.templatePlaceholder}</option>`;
      
      if (t.templates[categoryName]) {
        t.templates[categoryName].forEach(tmpl => {
          const opt = document.createElement('option');
          opt.value = tmpl;
          opt.textContent = tmpl;
          templateSelect.appendChild(opt);
        });
      }
    }

    window.applyTemplate = function() {
      const templateSelect = document.getElementById('templateSelect');
      const taskInput = document.getElementById('taskInput');
      if (templateSelect.value) {
        taskInput.value = templateSelect.value;
      }
    };

    window.renderTasks = function() {
      updateTemplates();
      const categoryIndex = document.getElementById('taskCategorySelect').value || 0;
      const categoryTasks = tasks[categoryIndex] || [];
      const listEl = document.getElementById('taskList');
      listEl.innerHTML = '';

      let completedCount = 0;
      categoryTasks.forEach((task, idx) => {
        if (task.completed) completedCount++;
        
        if (currentFilter === 'active' && task.completed) return;
        if (currentFilter === 'completed' && !task.completed) return;

        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <span onclick="toggleTask(${categoryIndex}, ${idx})" style="cursor: pointer; flex: 1; margin-right: 10px;">${task.text}</span>
          <button class="delete-btn" onclick="deleteTask(${categoryIndex}, ${idx})">&times;</button>
        `;
        listEl.appendChild(li);
      });

      const total = categoryTasks.length;
      const percent = total > 0 ? Math.round((completedCount / total) * 100) : 0;
      document.getElementById('progressPercent').innerText = `${percent}%`;
      document.getElementById('progressBarFill').style.width = `${percent}%`;
    };

    window.addTask = function() {
      const categoryIndex = document.getElementById('taskCategorySelect').value || 0;
      const taskInput = document.getElementById('taskInput');
      const text = taskInput.value.trim();
      if (!text) return;

      if (!tasks[categoryIndex]) {
        tasks[categoryIndex] = [];
      }
      tasks[categoryIndex].push({ text: text, completed: false });
      taskInput.value = '';
      document.getElementById('templateSelect').value = '';
      renderTasks();
      if (typeof window.saveUserData === 'function') {
        window.saveUserData(scores, tasks);
      }
    };

    window.toggleTask = function(catIdx, taskIdx) {
      tasks[catIdx][taskIdx].completed = !tasks[catIdx][taskIdx].completed;
      renderTasks();
      if (typeof window.saveUserData === 'function') {
        window.saveUserData(scores, tasks);
      }
    };

    window.deleteTask = function(catIdx, taskIdx) {
      tasks[catIdx].splice(taskIdx, 1);
      renderTasks();
      if (typeof window.saveUserData === 'function') {
        window.saveUserData(scores, tasks);
      }
    };

    window.setFilter = function(evt, filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      evt.currentTarget.classList.add('active');
      renderTasks();
    };

    // Initial setup on load
    applyTheme();
    applyLanguage();
  </script>
</body>
</html>
