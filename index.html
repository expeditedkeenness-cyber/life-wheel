<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Колесо Баланса и Задачи</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    h2, h3 { text-align: center; margin-bottom: 12px; }
    .chart-container { position: relative; width: 100%; max-width: 400px; margin: 0 auto; }
    .sliders { margin-top: 20px; }
    .slider-group { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .slider-group label { font-size: 14px; flex: 1; }
    .slider-group input { width: 45%; }
    .slider-group span { width: 25px; text-align: right; font-weight: bold; }
    
    .tasks-section { margin-top: 30px; border-top: 1px solid #ccc; padding-top: 15px; }
    select, input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #2481cc;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .task-list { list-style: none; padding: 0; margin-top: 10px; }
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.03);
      padding: 8px;
      margin-bottom: 6px;
      border-radius: 4px;
      font-size: 14px;
    }
    .task-item.completed span { text-decoration: line-through; color: gray; }
    .delete-btn { background: none; border: none; color: #ff4d4d; cursor: pointer; font-weight: bold; width: auto; padding: 0 5px; }
  </style>
</head>
<body>

  <h2>Колесо Жизненного Баланса</h2>
  
  <div class="chart-container">
    <canvas id="wheelChart"></canvas>
  </div>

  <div class="sliders" id="slidersContainer"></div>

  <div class="tasks-section">
    <h3>Цели и задачи по сферам</h3>
    <select id="taskCategorySelect"></select>
    <input type="text" id="taskInput" placeholder="Введите конкретную задачу...">
    <button onclick="addTask()">Добавить задачу</button>
    <ul class="task-list" id="taskList"></ul>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const categories = [
      'Здоровье', 'Финансы', 'Карьера', 'Рост',
      'Отношения', 'Яркость', 'Окружение', 'Быт'
    ];
    
    let scores = JSON.parse(localStorage.getItem('wheelScores')) || [5, 5, 5, 5, 5, 5, 5, 5];
    let tasks = JSON.parse(localStorage.getItem('wheelTasks')) || {};

    categories.forEach(cat => {
      if (!tasks[cat]) tasks[cat] = [];
    });

    const ctx = document.getElementById('wheelChart').getContext('2d');
    const wheelChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: categories,
        datasets: [{
          label: 'Уровень сферы (1-10)',
          data: scores,
          backgroundColor: 'rgba(36, 129, 204, 0.2)',
          borderColor: 'rgba(36, 129, 204, 1)',
          borderWidth: 2,
          pointBackgroundColor: 'rgba(36, 129, 204, 1)'
        }]
      },
      options: {
        scales: {
          r: {
            min: 0,
            max: 10,
            ticks: { stepSize: 2 }
          }
        },
        plugins: { legend: { display: false } }
      }
    });

    const container = document.getElementById('slidersContainer');
    categories.forEach((cat, index) => {
      const group = document.createElement('div');
      group.className = 'slider-group';
      group.innerHTML = `
        <label>${cat}</label>
        <input type="range" min="1" max="10" value="${scores[index]}" oninput="updateScore(${index}, this.value)">
        <span id="val-${index}">${scores[index]}</span>
      `;
      container.appendChild(group);
    });

    const select = document.getElementById('taskCategorySelect');
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });

    function updateScore(index, value) {
      scores[index] = Number(value);
      document.getElementById(`val-${index}`).innerText = value;
      wheelChart.data.datasets[0].data = scores;
      wheelChart.update();
      localStorage.setItem('wheelScores', JSON.stringify(scores));
    }

    function renderTasks() {
      const selectedCat = select.value;
      const listEl = document.getElementById('taskList');
      listEl.innerHTML = '';
      
      (tasks[selectedCat] || []).forEach((task, idx) => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <label style="display:flex; align-items:center; gap:8px; flex:1; cursor:pointer;">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${selectedCat}', ${idx})">
            <span>${task.text}</span>
          </label>
          <button class="delete-btn" onclick="deleteTask('${selectedCat}', ${idx})">×</button>
        `;
        listEl.appendChild(li);
      });
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      const selectedCat = select.value;
      if (!text) return;

      tasks[selectedCat].push({ text, completed: false });
      input.value = '';
      localStorage.setItem('wheelTasks', JSON.stringify(tasks));
      renderTasks();
    }

    function toggleTask(cat, idx) {
      tasks[cat][idx].completed = !tasks[cat][idx].completed;
      localStorage.setItem('wheelTasks', JSON.stringify(tasks));
      renderTasks();
    }

    function deleteTask(cat, idx) {
      tasks[cat].splice(idx, 1);
      localStorage.setItem('wheelTasks', JSON.stringify(tasks));
      renderTasks();
    }

    select.onchange = renderTasks;
    renderTasks();
  </script>
</body>
</html>
