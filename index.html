<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо Баланса</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --accent-color: #3b82f6;
            --border-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 480px;
            padding: 12px 16px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 16px;
            padding: 6px;
            border-radius: 50%;
            background-color: var(--card-bg);
        }

        .user-menu {
            font-size: 12px;
            color: var(--text-muted);
            background: var(--card-bg);
            padding: 6px 10px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-menu a {
            color: #f87171;
            text-decoration: none;
            font-weight: bold;
        }

        /* Навигация (вкладки) */
        nav {
            display: flex;
            width: 100%;
            max-width: 480px;
            justify-content: space-around;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            padding-bottom: 6px;
            border-bottom: 2px solid transparent;
        }

        nav a.active {
            color: var(--text-color);
            border-bottom-color: var(--accent-color);
            font-weight: 500;
        }

        /* Контент */
        .container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            box-sizing: border-box;
        }

        /* Секция ползунков */
        .sliders-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 20px;
        }

        .slider-item {
            background-color: var(--card-bg);
            padding: 12px 14px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .slider-value {
            font-weight: bold;
            color: var(--accent-color);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
            height: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Колесо Баланса</div>
        <div class="header-controls">
            <div class="user-menu">
                <span>expeditedkeenness</span>
                <a href="#">Выйти</a>
            </div>
            <button class="btn-icon">🌙</button>
            <button class="btn-icon">RU</button>
        </div>
    </header>

    <nav>
        <a href="#" class="active">📊 Колесо</a>
        <a href="#">📖 Опис</a>
        <a href="#">✅ Задания</a>
    </nav>

    <div class="container">
        <!-- Место под график Колеса -->
        <div style="text-align: center; padding: 20px 0; color: var(--text-muted);">
            [ График колеса баланса ]
        </div>

        <div class="sliders-section">
            <div class="slider-item">
                <div class="slider-header">
                    <span>Работа</span>
                    <span class="slider-value">6</span>
                </div>
                <input type="range" min="1" max="10" value="6">
            </div>
            <div class="slider-item">
                <div class="slider-header">
                    <span>Семья</span>
                    <span class="slider-value">8</span>
                </div>
                <input type="range" min="1" max="10" value="8">
            </div>
            <div class="slider-item">
                <div class="slider-header">
                    <span>Друзья</span>
                    <span class="slider-value">6</span>
                </div>
                <input type="range" min="1" max="10" value="6">
            </div>
        </div>
    </div>

</body>
</html>
